apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-metrics-exporter
  namespace: uc3-applications
  labels:
    app: pod-metrics-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-metrics-exporter
  template:
    metadata:
      labels:
        app: pod-metrics-exporter
    spec:
      serviceAccountName: pod-metrics-exporter
      containers:
      - name: pod-metrics-exporter
        image: k8s.gcr.io/kube-state-metrics/kube-state-metrics:v2.9.2
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 8081
          name: metrics-self
        args:
        - --port=8080
        - --resources=pods,deployments,replicasets
        - --namespaces=uc3-applications
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: pod-metrics-exporter
  namespace: uc3-applications
  labels:
    app: pod-metrics-exporter
spec:
  selector:
    app: pod-metrics-exporter
  ports:
  - port: 8080
    targetPort: 8080
    name: metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-metrics-exporter
  namespace: uc3-applications
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-metrics-exporter
rules:
- apiGroups: [""]
  resources: ["pods", "nodes", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-metrics-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-metrics-exporter
subjects:
- kind: ServiceAccount
  name: pod-metrics-exporter
  namespace: uc3-applications
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pod-metrics-exporter
  namespace: uc3-applications
  labels:
    prometheus: user-workload
spec:
  selector:
    matchLabels:
      app: pod-metrics-exporter
  endpoints:
  - port: metrics
    interval: 30s
    scheme: http
  namespaceSelector:
    matchNames:
    - uc3-applications
