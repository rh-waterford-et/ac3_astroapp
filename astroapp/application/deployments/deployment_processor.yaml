# ==========================
# Note: This deployment uses shared secrets and config
# See: secrets.yaml and configmap.yaml
# ==========================
# ==========================
# Deployment
# ==========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ucm-processor
  namespace: uc3-applications
  labels:
    app: ucm-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ucm-processor
  template:
    metadata:
      labels:
        app: ucm-processor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: starlight-sa
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      volumes:
        - name: processing-storage
          persistentVolumeClaim:
            claimName: ucm-pv-claim

      containers:
        # --- STARLIGHT ---
        - name: starlight
          image: quay.io/bcapper30/starlight:latest
          workingDir: /docker/starlight/STARLIGHTv04
          command: ["./bash_script2.sh"]
          volumeMounts:
            - name: processing-storage
              mountPath: /processing_data/
          securityContext:
            privileged: true

        # --- Receiver ---
        - name: receiver
          image: quay.io/rh-ee-kromashk/uc3-backend:latest
          workingDir: /processing_data/
          command: ["/usr/bin/ucm", "consumer", "processor"] 
          envFrom:
            - configMapRef:
                name: uc3-shared-config
            - secretRef:
                name: uc3-shared-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PROCESS_LIST_STARLIGHT_PATH
              valueFrom:
                configMapKeyRef:
                  name: uc3-shared-config
                  key: PROCESS_LIST_STARLIGHT_PATH
            - name: PROCESS_LIST_STARLIGHT
              value: "/processing_data/starlight/runtime/processlist-$(POD_NAME).txt"
            - name: PROCESS_LIST_PPXF_PATH
              valueFrom:
                configMapKeyRef:
                  name: uc3-shared-config
                  key: PROCESS_LIST_PPXF_PATH
            - name: PROCESS_LIST_PPXF
              value: "/processing_data/ppxf/runtime/processlist-$(POD_NAME).txt"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: processing-storage
              mountPath: /processing_data/
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

        # --- Watcher --- 
        - name: watcher
          image: quay.io/rh-ee-kromashk/uc3-backend:latest
          workingDir: /processing_data/
          command: ["/usr/bin/ucm", "watcher", "processor"]
          envFrom:
            - configMapRef:
                name: uc3-shared-config
            - secretRef:  
                name: uc3-shared-secrets
          volumeMounts:
            - name: processing-storage
              mountPath: /processing_data/
          securityContext:
            privileged: true

        # --- PPXF ---
        - name: ppxf
          image: quay.io/bcapper30/uc3-ppxf:latest
          workingDir: /processing_data/
          command: ["/home/ppxf/ppxf_script.sh"]
          envFrom:
            - configMapRef:
                name: uc3-shared-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: API_URL
              value: "http://uc3-backend-service:8080/api/progress/update"
          volumeMounts:
            - name: processing-storage
              mountPath: /processing_data/
          securityContext:
            privileged: true
---
# ==========================
# Service
# ==========================
apiVersion: v1
kind: Service
metadata:
  name: ucm-processor-service
  namespace: uc3-applications
  labels:
    app: ucm-processor
    svc: ucm
spec:
  selector:
    app: ucm-processor
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
# ==========================
# ServiceMonitor 
# ==========================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ucm-processor-monitor
  namespace: uc3-applications
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: ucm-processor
  namespaceSelector:
    matchNames:
      - uc3-applications
  endpoints:
    - port: http
      interval: 15s
      path: /metrics