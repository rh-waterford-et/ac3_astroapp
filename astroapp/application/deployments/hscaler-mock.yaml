# ==========================
# HScaler Mock API
# ==========================
# Deployment
# ==========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-api
  namespace: uc3-applications
  labels:
    app: mock-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-api
  template:
    metadata:
      labels:
        app: mock-api
    spec:
      containers:
      - name: mock-api
        image: quay.io/rcarroll/ac3_uc3/predicter_mock_api:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
---
# ==========================
# Service
# ==========================
apiVersion: v1
kind: Service
metadata:
  name: mock-api
  namespace: uc3-applications
  labels:
    app: mock-api
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: mock-api

