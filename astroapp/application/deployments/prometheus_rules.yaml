apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-monitoring-rules
  namespace: uc3-applications
  labels:
    prometheus: user-workload
spec:
  groups:
  - name: pod.rules
    rules:
    - alert: PodDown
      expr: up{job="kubernetes-pods"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Pod {{ $labels.kubernetes_pod_name }} is down"
        description: "Pod {{ $labels.kubernetes_pod_name }} in namespace {{ $labels.kubernetes_namespace }} has been down for more than 5 minutes."
    
    - alert: HighPodCount
      expr: kube_pod_info{namespace="uc3-applications"} > 10
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High pod count detected"
        description: "There are {{ $value }} pods running, which is above the threshold of 10."
    
    - alert: LowPodCount
      expr: count(kube_pod_info{namespace="uc3-applications"}) < 1
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "No pods running"
        description: "There are {{ $value }} pods running in the namespace."
    
    - alert: PodRestartHigh
      expr: rate(kube_pod_container_status_restarts_total[5m]) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High pod restart rate"
        description: "Pod {{ $labels.pod }} is restarting frequently: {{ $value }} restarts per second."
    
    - alert: PodCPUHigh
      expr: rate(container_cpu_usage_seconds_total[5m]) > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage on pod"
        description: "Pod {{ $labels.pod }} CPU usage is {{ $value }} which is above 80%."
    
    - alert: PodMemoryHigh
      expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage on pod"
        description: "Pod {{ $labels.pod }} memory usage is {{ $value }} which is above 80%."
    
    - alert: DeploymentReplicasMismatch
      expr: kube_deployment_status_replicas != kube_deployment_spec_replicas
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Deployment replicas mismatch"
        description: "Deployment {{ $labels.deployment }} has {{ $value }} replicas running but {{ $labels.spec_replicas }} expected."
    
    - alert: PodNotReady
      expr: kube_pod_status_phase{phase!="Running",namespace="uc3-applications"} == 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} is not ready"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is in {{ $labels.phase }} state."
