# ==========================
# Storage Resources for UC3 Application
# ==========================
# Persistent Volume for Processor
# ==========================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ucm-pv-volume
  namespace: uc3-applications
  labels:
    type: local
spec:
  storageClassName: standard
  capacity:
    storage: 10Gi
  accessModes:
  - ReadWriteOnce
  hostPath:
    path: "/mnt/ucmdata"
---
# ==========================
# Persistent Volume Claim for Processor
# ==========================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ucm-pv-claim
  namespace: uc3-applications
spec:
  storageClassName: standard
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
# ==========================
# Persistent Volume for Producer
# ==========================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ucm-pv-volume-producer
  namespace: uc3-applications
  labels:
    type: local
spec:
  storageClassName: standard
  capacity:
    storage: 10Gi
  accessModes:
  - ReadWriteOnce
  hostPath:
    path: "/mnt/ucmdemo"
---
# ==========================
# Persistent Volume Claim for Producer
# ==========================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ucm-pv-claim-producer
  namespace: uc3-applications
spec:
  storageClassName: standard
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi

