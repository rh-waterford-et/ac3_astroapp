ApplicationName: "starlight-uc3"
Version: "1.0.0"

Volumes_configuration:
  - VolumeName: "ucm-pv-storage"
    VolumeType: "PersistentVolume"
    StorageClass: "standard"
    Capacity: "10Gi"
    AccessModes:
      - "ReadWriteOnce"
    HostPath:
      Path: "/mnt/ucmdata"
    ClaimName: "ucm-pv-claim"
    ClaimSpec:
      StorageClassName: "standard"
      AccessModes:
        - "ReadWriteOnce"
      Resources:
        Requests:
          Storage: "3Gi"

Security_configuration:
  - ServiceAccountName: "starlight-sa"
    ApiVersion: "v1"
    Kind: "ServiceAccount"
    Metadata:
      Name: "starlight-sa"
  - RoleBindingName: "privileged-role"
    ApiVersion: "rbac.authorization.k8s.io/v1"
    Kind: "RoleBinding"
    Metadata:
      Name: "privileged-role"
    RoleRef:
      ApiGroup: "rbac.authorization.k8s.io"
      Kind: "ClusterRole"
      Name: "system:openshift:scc:privileged"
    Subjects:
      - Kind: "ServiceAccount"
        Name: "starlight-sa"
      
Microservices_configuration:
# Orchestrator Pods Containers
## Watcher-Producer
  - MicroserviceName: "orchestrator"
    Image: "quay.io/rh-ee-kromashk/uc3-backend:latest"
    ID: "watcher-producer"
    ClusterAffinity: "orchestrator"
    Dependencies:
      - "rabbitmq"
    ResourceRequirements:
      Cpu: "2 vCPU"
      Memory: "4Gi"
    MicroservicesSLAs:
      ServiceAvailability: "99.9%"
      MaxResponseTime: "N/A"
      DataThroughput: "High"
    ReplicaCount: "1"
    ServiceAccountName: "starlight-sa"
    SecurityContext:
      privileged: true
    Command:
      - /uid_entrpoint.sh
    Args:
      - /usr/bin/ucm
      - watcher
      - producer
    WorkingDirectory: "/processing_data/"
    EnvironmentVariables:
        - name: RABBITMQ_USER
          value: "guest"
        - name: RABBITMQ_PASSWORD
          value: "guest"
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: JOB_SIZE
          value: "5"
        - name: AWS_ACCESS_KEY_ID
          value: "EEAAAAHuEn6LkwZJGpUAikGoJHyOrAra4yXAV1WVXpvA8XU0HAAAAAEB7vvNAAAAAAHu-80YrfBIAbZ4Ef4idjOF9BTQ"
        - name: AWS_SECRET_ACCESS_KEY
          value: "D3c2ApVsGGa7Wm1+pmfDwJddoPxhY3qSwU1U2EUUyKJRE07H3MjR3nwwaxim7mhY"
        - name: S3_ENDPOINT
          value: "https://s3.eu-central-1.ionoscloud.com"
        - name: S3_REGION
          value: "de"
        - name: S3_BUCKET_NAME
          value: "test-consumer"
        - name: EXPLORED_STARLIGHT
          value: "starlight/input"
        - name: EXPLORED_PPXF
          value: "ppxf/input"
        - name: EXPLORED_STECKMAP
          value: "steckmap/input"
        - name: PROCESSED_STARLIGHT
          value: "starlight/processed"
        - name: PROCESSED_PPXF
          value: "ppxf/processed"
        - name: PROCESSED_STECKMAP
          value: "steckmap/processed"
        - name: OUTPUT_STARLIGHT
          value: "starlight/output"
