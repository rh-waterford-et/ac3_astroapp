    Dependencies:
      - "data-connector"
    ReplicaCount: "1"
    ServiceAccountName: "starlight-sa"
    SecurityContext:
      privileged: true

# Connector Vault
  - MicroserviceName: "vault"
    Image: "hashicorp/vault:1.17.2"
    ID: "vault"
    ClusterAffinity: "orchestrator"
    Dependencies: []
    ResourceRequirements:
      Cpu: "0.5 vCPU"
      Memory: "1Gi"
    ReplicaCount: "1"
    Ports:
      - ContainerPort: "8200"
    SecurityContext:
      privileged: true
    EnvironmentVariables:
      - Name: "VAULT_DEV_ROOT_TOKEN_ID"
        Value: "test-token"
      - Name: "VAULT_ADDR"
        Value: "http://0.0.0.0:8200"

#RabbitMQ
  - MicroserviceName: "rabbitmq"
    Version: "3-management"
    Image: "rabbitmq:3-management"
    ID: "rabbitmq"
    ClusterAffinity: "orchestrator"
    Dependencies: []
    ResourceRequirements:
      Cpu: "0.5 vCPU"
      Memory: "1Gi"
    ReplicaCount: "1"
    Ports:
      - ContainerPort: "5672"
      - ContainerPort: "15672"
    EnvironmentVariables:
      - Name: "RABBITMQ_DEFAULT_USER"
        Value: "guest"
      - Name: "RABBITMQ_DEFAULT_PASS"
        Value: "guest"

# RabbitMQ Exporter
  - MicroserviceName: "rabbitmq-exporter"
    Image: "kbudde/rabbitmq-exporter:latest"
    ID: "rabbitmq-exporter"
    ClusterAffinity: "orchestrator"
    Dependencies:
      - "rabbitmq"
    ResourceRequirements:
      Cpu: "0.25 vCPU"
      Memory: "256Mi"
    ReplicaCount: "1"
    Ports:
      - ContainerPort: "9419"
    EnvironmentVariables:
      - Name: "RABBIT_URL"
        Value: "http://rabbitmq:15672"
      - Name: "RABBIT_USER"
        Value: "guest"
      - Name: "RABBIT_PASSWORD"
        Value: "guest"

# Redis
  - MicroserviceName: "redis"
    Image: "registry.redhat.io/rhel8/redis-6:latest"
    ID: "redis"
    ClusterAffinity: "orchestrator"
    Dependencies:
      - "orchestrator"
    ResourceRequirements:
      Cpu: "0.5 vCPU"
      Memory: "256Mi"
    ReplicaCount: "1"
    Ports:
      - ContainerPort: "6379"
    Volumes:
      - Name: "redis-data"
        VolumeSource:
          EmptyDir: {}
    VolumeMounts:
      - Name: "redis-data"
        MountPath: "/data"

Networking_graph:
  - Source: "orchestrator"
    Destination: "rabbitmq"
    Protocol: "TCP"
    Port: "5672"
  - Source: "processor"
    Destination: "rabbitmq"
    Protocol: "TCP"
    Port: "5672"
  - Source: "data-connector"
    Destination: "orchestrator"
    Protocol: "HTTP"
    Port: "9192"
  - Source: "rabbitmq-exporter"
    Destination: "rabbitmq"
    Protocol: "HTTP"
    Port: "15672"
  - Source: "frontend"
    Destination: "processor"
    Protocol: "HTTP"
    Port: "8080"
  - Source: "frontend"
    Destination: "orchestrator"
    Protocol: "HTTP"
    Port: "8080"
    # Discuss routes with Fingletek

Global_SLA:
  ServiceAvailability: "99.9%"
  MaxLatency: "500 ms"
  MaxResponseTime: "N/A"
  DataThroughput: "High"
