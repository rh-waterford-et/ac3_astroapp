# UC3 Autoscaling Experiment Configuration
# This file demonstrates all available configuration options

# Experiment metadata
name: "uc3-autoscaling-experiment"
description: "UC3 autoscaling training data generation experiment"

# Processor scaling configuration
scaling:
  processor_counts: [1, 2, 3, 5, 7, 10]  # Processor counts to test (runs dataset once per count for ML training data)
  stabilize_time: "0s"                   # Time to wait after scaling before triggering processing

# Workload generation configuration
workload:
  dataset: "NGC7025"                # Dataset to process
  processor_type: "starlight"      # "starlight" or "ppxf"

# Metrics collection configuration
metrics:
  output_directory: "./experiment-data"

# Infrastructure connection details
infrastructure:
  # Kubernetes configuration
  kube_config: ""                  # Path to kubeconfig file (empty = in-cluster)
  namespace: "uc3-applications"
  deployment_name: "ucm-processor-deployment"

  # UC3 API endpoints
  uc3_api_base_url: "http://localhost:8080"
  trigger_url: "http://localhost:8081"

  # Redis connection
  redis_host: "localhost"
  redis_port: 6379
  redis_password: ""

  # RabbitMQ metrics
  rabbitmq_exporter_url: "http://localhost:9419/metrics" 