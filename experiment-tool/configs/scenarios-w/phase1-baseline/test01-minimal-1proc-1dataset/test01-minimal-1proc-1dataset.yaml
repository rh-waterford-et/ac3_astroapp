# Test 1: Minimal Single
# Phase 1: Baseline Discovery
# Description: Absolute minimum - baseline
name: "test01-test01-minimal-1proc-1dataset"
description: "Absolute minimum - baseline"

scaling:
  processor_count: 1
  stabilize_time: "180s"

workload:
  datasets:
    - name: "NGC7020"
      processor_type: "starlight"
  failure_strategy: "continue"
  dataset_start_interval: "30s"
  job_size: 5

metrics:
  output_directory: "/app/experiment-data"

infrastructure:
  namespace: "uc3-applications"
  deployment_name: "ucm-processor-deployment"
  uc3_api_base_url: "http://uc3-backend-service:8080"
  trigger_url: "http://uc3-backend-service:8081"
  redis_host: "redis"
  redis_port: 6379
