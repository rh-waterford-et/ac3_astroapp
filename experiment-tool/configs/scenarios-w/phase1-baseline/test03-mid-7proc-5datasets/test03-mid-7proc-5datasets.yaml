# Test 3: Mid Scale
# Phase 1: Baseline Discovery
# Description: Mid scale - balanced
name: "test03-test03-mid-7proc-5datasets"
description: "Mid scale - balanced"

scaling:
  processor_count: 7
  stabilize_time: "180s"

workload:
  datasets:
    - name: "NGC7020"
      processor_type: "starlight"
    - name: "NGC7021"
      processor_type: "starlight"
    - name: "NGC7022"
      processor_type: "starlight"
    - name: "NGC7023"
      processor_type: "starlight"
    - name: "NGC7024"
      processor_type: "starlight"
  failure_strategy: "continue"
  dataset_start_interval: "45s"
  job_size: 12

metrics:
  output_directory: "/app/experiment-data"

infrastructure:
  namespace: "uc3-applications"
  deployment_name: "ucm-processor-deployment"
  uc3_api_base_url: "http://uc3-backend-service:8080"
  trigger_url: "http://uc3-backend-service:8081"
  redis_host: "redis"
  redis_port: 6379
