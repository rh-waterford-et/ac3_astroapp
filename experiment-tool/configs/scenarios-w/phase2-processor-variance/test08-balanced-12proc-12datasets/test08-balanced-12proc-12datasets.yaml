# Test 8: Balanced
# Phase 2: Processor Variance
# Description: 1:1 ratio - balanced load
name: "test08-test08-balanced-12proc-12datasets"
description: "1:1 ratio - balanced load"

scaling:
  processor_count: 12
  stabilize_time: "180s"

workload:
  datasets:
    - name: "NGC7020"
      processor_type: "starlight"
    - name: "NGC7021"
      processor_type: "starlight"
    - name: "NGC7022"
      processor_type: "starlight"
    - name: "NGC7023"
      processor_type: "starlight"
    - name: "NGC7024"
      processor_type: "starlight"
    - name: "NGC7025"
      processor_type: "starlight"
    - name: "NGC7026"
      processor_type: "starlight"
    - name: "NGC7027"
      processor_type: "starlight"
    - name: "NGC7028"
      processor_type: "starlight"
    - name: "NGC7029"
      processor_type: "starlight"
    - name: "NGC7030"
      processor_type: "starlight"
    - name: "NGC7031"
      processor_type: "starlight"
  failure_strategy: "continue"
  dataset_start_interval: "30s"
  job_size: 20

metrics:
  output_directory: "/app/experiment-data"

infrastructure:
  namespace: "uc3-applications"
  deployment_name: "ucm-processor-deployment"
  uc3_api_base_url: "http://uc3-backend-service:8080"
  trigger_url: "http://uc3-backend-service:8081"
  redis_host: "redis"
  redis_port: 6379
