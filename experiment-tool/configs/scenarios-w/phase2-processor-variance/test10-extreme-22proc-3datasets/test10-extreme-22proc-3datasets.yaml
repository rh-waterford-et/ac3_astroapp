# Test 10: Extreme Over-provision
# Phase 2: Processor Variance
# Description: Extreme over-provisioning
name: "test10-test10-extreme-22proc-3datasets"
description: "Extreme over-provisioning"

scaling:
  processor_count: 22
  stabilize_time: "180s"

workload:
  datasets:
    - name: "NGC7020"
      processor_type: "starlight"
    - name: "NGC7021"
      processor_type: "starlight"
    - name: "NGC7022"
      processor_type: "starlight"
  failure_strategy: "continue"
  dataset_start_interval: "10s"
  job_size: 12

metrics:
  output_directory: "/app/experiment-data"

infrastructure:
  namespace: "uc3-applications"
  deployment_name: "ucm-processor-deployment"
  uc3_api_base_url: "http://uc3-backend-service:8080"
  trigger_url: "http://uc3-backend-service:8081"
  redis_host: "redis"
  redis_port: 6379
