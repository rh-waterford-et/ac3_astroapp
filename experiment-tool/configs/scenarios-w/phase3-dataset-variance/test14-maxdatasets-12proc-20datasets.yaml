# Test 14: Maximum Datasets
# Phase 3: Dataset Variance
# Description: Moderate processors - all datasets
name: "test14-test14-maxdatasets-12proc-20datasets"
description: "Moderate processors - all datasets"

scaling:
  processor_count: 12
  stabilize_time: "180s"

workload:
  datasets:
    - name: "NGC7020"
      processor_type: "starlight"
    - name: "NGC7021"
      processor_type: "starlight"
    - name: "NGC7022"
      processor_type: "starlight"
    - name: "NGC7023"
      processor_type: "starlight"
    - name: "NGC7024"
      processor_type: "starlight"
    - name: "NGC7025"
      processor_type: "starlight"
    - name: "NGC7026"
      processor_type: "starlight"
    - name: "NGC7027"
      processor_type: "starlight"
    - name: "NGC7028"
      processor_type: "starlight"
    - name: "NGC7029"
      processor_type: "starlight"
    - name: "NGC7030"
      processor_type: "starlight"
    - name: "NGC7031"
      processor_type: "starlight"
    - name: "NGC7032"
      processor_type: "starlight"
    - name: "NGC7033"
      processor_type: "starlight"
    - name: "NGC7034"
      processor_type: "starlight"
    - name: "NGC7035"
      processor_type: "starlight"
    - name: "NGC7036"
      processor_type: "starlight"
    - name: "NGC7037"
      processor_type: "starlight"
    - name: "NGC7038"
      processor_type: "starlight"
