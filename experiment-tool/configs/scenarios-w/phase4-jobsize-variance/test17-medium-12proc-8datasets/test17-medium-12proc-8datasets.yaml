# Test 17: Medium Jobs
# Phase 4: Job Size Variance
# Description: Medium jobs
name: "test17-test17-medium-12proc-8datasets"
description: "Medium jobs"

scaling:
  processor_count: 12
  stabilize_time: "180s"

workload:
  datasets:
    - name: "NGC7020"
      processor_type: "starlight"
    - name: "NGC7021"
      processor_type: "starlight"
    - name: "NGC7022"
      processor_type: "starlight"
    - name: "NGC7023"
      processor_type: "starlight"
    - name: "NGC7024"
      processor_type: "starlight"
    - name: "NGC7025"
      processor_type: "starlight"
    - name: "NGC7026"
      processor_type: "starlight"
    - name: "NGC7027"
      processor_type: "starlight"
  failure_strategy: "continue"
  dataset_start_interval: "30s"
  job_size: 10

metrics:
  output_directory: "/app/experiment-data"

infrastructure:
  namespace: "uc3-applications"
  deployment_name: "ucm-processor-deployment"
  uc3_api_base_url: "http://uc3-backend-service:8080"
  trigger_url: "http://uc3-backend-service:8081"
  redis_host: "redis"
  redis_port: 6379
