# Test 19: Huge Jobs
# Phase 4: Job Size Variance
# Description: Very large jobs - fewest count
name: "test19-test19-huge-20proc-5datasets"
description: "Very large jobs - fewest count"

scaling:
  processor_count: 20
  stabilize_time: "180s"

workload:
  datasets:
    - name: "NGC7020"
      processor_type: "starlight"
    - name: "NGC7021"
      processor_type: "starlight"
    - name: "NGC7022"
      processor_type: "starlight"
    - name: "NGC7023"
      processor_type: "starlight"
    - name: "NGC7024"
      processor_type: "starlight"
  failure_strategy: "continue"
  dataset_start_interval: "15s"
  job_size: 68

metrics:
  output_directory: "/app/experiment-data"

infrastructure:
  namespace: "uc3-applications"
  deployment_name: "ucm-processor-deployment"
  uc3_api_base_url: "http://uc3-backend-service:8080"
  trigger_url: "http://uc3-backend-service:8081"
  redis_host: "redis"
  redis_port: 6379
