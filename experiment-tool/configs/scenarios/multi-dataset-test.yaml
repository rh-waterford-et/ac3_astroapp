# Multi-Dataset Test Scenario - Example of concurrent dataset processing
name: "multi-dataset-test"
description: "Test concurrent processing of multiple datasets with staggered starts"

scaling:
  min_processors: 1
  max_processors: 1
  scale_steps: [1]
  stabilize_time: "30s"
  scale_up_interval: "1m"
  scale_down_interval: "45s"

workload:
  # Multi-dataset configuration
  datasets:
    - name: "NGC7000"
      processor_type: "starlight"
    - name: "NGC7021"
      processor_type: "starlight"
    - name: "NGC7022"
      processor_type: "starlight"
    - name: "NGC7023"
      processor_type: "starlight"
    - name: "NGC7024"
      processor_type: "starlight"
  
  # Multi-dataset timing and limits
  dataset_start_interval: "1m"
  max_concurrent_datasets: 5      
  failure_strategy: "continue"     
  
  # Common workload settings
  batch_size: 5
  submission_rate: "15s"
  job_size_variation: "small"
  pauses_between_jobs: false

metrics:
  collection_interval: "10s"
  export_format: "csv"
  output_directory: "/app/experiment-data"
  include_job_level: true
  include_summary: true

infrastructure:
  namespace: "uc3-applications"
  deployment_name: "starlight"
  uc3_api_base_url: "http://uc3-backend-service:8080"
  trigger_url: "http://uc3-backend-service:8081"
  redis_host: "redis"
  redis_port: 6379
  rabbitmq_exporter_url: "http://rabbitmq-exporter:9419/metrics" 