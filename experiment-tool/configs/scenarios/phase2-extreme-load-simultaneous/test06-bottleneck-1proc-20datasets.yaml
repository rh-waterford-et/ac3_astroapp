# Test 6: Maximum Bottleneck
# Phase 2: Extreme Load - Simultaneous
# Description: Maximum bottleneck - many small jobs
name: "test06-test06-bottleneck-1proc-20datasets"
description: "Maximum bottleneck - many small jobs"

scaling:
  processor_count: 1
  stabilize_time: "180s"

workload:
  datasets:
    - name: "NGC7020"
      processor_type: "starlight"
    - name: "NGC7021"
      processor_type: "starlight"
    - name: "NGC7022"
      processor_type: "starlight"
    - name: "NGC7023"
      processor_type: "starlight"
    - name: "NGC7024"
      processor_type: "starlight"
    - name: "NGC7025"
      processor_type: "starlight"
    - name: "NGC7026"
      processor_type: "starlight"
    - name: "NGC7027"
      processor_type: "starlight"
    - name: "NGC7028"
      processor_type: "starlight"
    - name: "NGC7029"
      processor_type: "starlight"
    - name: "NGC7030"
      processor_type: "starlight"
    - name: "NGC7031"
      processor_type: "starlight"
    - name: "NGC7032"
      processor_type: "starlight"
    - name: "NGC7033"
      processor_type: "starlight"
    - name: "NGC7034"
      processor_type: "starlight"
    - name: "NGC7035"
      processor_type: "starlight"
    - name: "NGC7036"
      processor_type: "starlight"
    - name: "NGC7037"
      processor_type: "starlight"
    - name: "NGC7038"
      processor_type: "starlight"
