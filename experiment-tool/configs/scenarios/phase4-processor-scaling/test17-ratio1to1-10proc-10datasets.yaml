# Test 17: 1:1 Dataset Ratio
# Phase 4: Processor Scaling Discovery
# Description: 1:1 ratio
name: "test17-test17-ratio1to1-10proc-10datasets"
description: "1:1 ratio"

scaling:
  processor_count: 10
  stabilize_time: "180s"

workload:
  datasets:
    - name: "NGC7020"
      processor_type: "starlight"
    - name: "NGC7021"
      processor_type: "starlight"
    - name: "NGC7022"
      processor_type: "starlight"
    - name: "NGC7023"
      processor_type: "starlight"
    - name: "NGC7024"
      processor_type: "starlight"
    - name: "NGC7025"
      processor_type: "starlight"
    - name: "NGC7026"
      processor_type: "starlight"
    - name: "NGC7027"
      processor_type: "starlight"
    - name: "NGC7028"
      processor_type: "starlight"
    - name: "NGC7029"
      processor_type: "starlight"
  failure_strategy: "continue"
  dataset_start_interval: "30s"
  job_size: 5

metrics:
  output_directory: "/app/experiment-data"

infrastructure:
  namespace: "uc3-applications"
  deployment_name: "ucm-processor-deployment"
  uc3_api_base_url: "http://uc3-backend-service:8080"
  trigger_url: "http://uc3-backend-service:8081"
  redis_host: "redis"
  redis_port: 6379
