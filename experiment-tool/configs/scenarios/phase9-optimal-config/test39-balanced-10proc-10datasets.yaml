# Test 39: Balanced 1:1 Short Stagger
# Phase 9: Optimal Configuration
# Description: Balanced - 1:1 ratio short stagger medium jobs
name: "test39-test39-balanced-10proc-10datasets"
description: "Balanced - 1:1 ratio short stagger medium jobs"

scaling:
  processor_count: 10
  stabilize_time: "180s"

workload:
  datasets:
    - name: "NGC7020"
      processor_type: "starlight"
    - name: "NGC7021"
      processor_type: "starlight"
    - name: "NGC7022"
      processor_type: "starlight"
    - name: "NGC7023"
      processor_type: "starlight"
    - name: "NGC7024"
      processor_type: "starlight"
    - name: "NGC7025"
      processor_type: "starlight"
    - name: "NGC7026"
      processor_type: "starlight"
    - name: "NGC7027"
      processor_type: "starlight"
    - name: "NGC7028"
      processor_type: "starlight"
    - name: "NGC7029"
      processor_type: "starlight"
  failure_strategy: "continue"
  dataset_start_interval: "20s"
  job_size: 10

metrics:
  output_directory: "/app/experiment-data"

infrastructure:
  namespace: "uc3-applications"
  deployment_name: "ucm-processor-deployment"
  uc3_api_base_url: "http://uc3-backend-service:8080"
  trigger_url: "http://uc3-backend-service:8081"
  redis_host: "redis"
  redis_port: 6379
