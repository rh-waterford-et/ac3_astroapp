# Quick Test Scenario - Minimal configuration for testing
name: "quick-test"
description: "Quick test with minimal processor scaling for development"

scaling:
  min_processors: 1
  max_processors: 1
  scale_steps: [1]
  stabilize_time: "30s"
  scale_up_interval: "1m"
  scale_down_interval: "45s"

workload:
  dataset: "/app/datasets/NGC7025_short"
  processor_type: "starlight"
  batch_size: 5
  submission_rate: "15s"
  job_size_variation: "small"
  pauses_between_jobs: false

metrics:
  collection_interval: "10s"
  export_format: "csv"
  output_directory: "/app/experiment-data"
  include_job_level: true
  include_summary: true

infrastructure:
  namespace: "uc3-applications"
  deployment_name: "starlight"
  uc3_api_base_url: "http://uc3-backend-service:8080"
  trigger_url: "http://uc3-backend-service:8081"
  redis_host: "redis"
  redis_port: 6379
  rabbitmq_exporter_url: "http://rabbitmq-exporter:9419/metrics" 