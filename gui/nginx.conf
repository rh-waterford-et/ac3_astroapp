events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Configure temp paths for OpenShift compatibility
    client_body_temp_path /tmp/nginx_client_temp 1 2;
    proxy_temp_path /tmp/nginx_proxy_temp 1 2;
    fastcgi_temp_path /tmp/nginx_fastcgi_temp 1 2;
    uwsgi_temp_path /tmp/nginx_uwsgi_temp 1 2;
    scgi_temp_path /tmp/nginx_scgi_temp 1 2;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Handle large file uploads for astronomical data
        client_max_body_size 1024M;
        client_body_timeout 300s;
        client_header_timeout 300s;

        # Serve static files with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff";
            try_files $uri =404;
        }

        # API proxy to backend service in OpenShift
        location /api/ {
            proxy_pass http://uc3-backend-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Add debugging headers
            proxy_set_header X-Debug-Proxy "nginx-to-backend";
            
            # Large file upload configuration
            client_max_body_size 1024M;
            client_body_buffer_size 128k;
            client_body_timeout 300s;
            
            # Disable proxy buffering for large uploads
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Let the backend handle CORS headers to avoid duplication
            
            # Timeout settings for long-running requests
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Add better error handling
            proxy_intercept_errors on;
            error_page 502 503 504 /50x.html;
        }
        
        # Error page for proxy errors
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Handle React Router client-side routing
        location / {
            try_files $uri $uri/ /index.html;
            
            # Cache control for index.html
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
} 