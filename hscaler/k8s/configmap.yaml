apiVersion: v1
kind: ConfigMap
metadata:
  name: predictor-client-config
  namespace: uc3-applications
  labels:
    app: predictor-client
data:
  config.yaml: |
    # Predictor Client Configuration

    # Prediction API settings
    predictor_api:
      url: "http://model-api:5000/predict"  # Points to model-api service

    # Prometheus settings
    prometheus:
      url: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
      
    # Prometheus queries for required metrics
    prometheus_queries:
      numprocessors: "num_processors"  # Replace with actual Prometheus query
      jobsize: "astroapp_job_size_mb"   # Relace with actual Prometheus query
      queuelen: "astroapp_job_queue_ahead_length"            # Replace with actual Prometheus query

    # Query interval in seconds
    query_interval_seconds: 10

    # Number of predictions to average (sliding window size)
    averaging_window_size: 5

    # Exporter settings
    exporter:
      port: 9090  # Port for Prometheus metrics endpoint
